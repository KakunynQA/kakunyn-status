# Kakunyn Grid status monitoring (GRD-294).
# Probes run on GitHub Actions (free on public repos); history/incidents are
# git-tracked here. The user-facing page is app.kakunyn.com/status, which
# renders this repo's api/*.json summaries; the GitHub Pages site below is the
# raw/backing status site.
owner: KakunynQA
repo: kakunyn-status

sites:
  - name: Grid API
    url: https://api.kakunyn.com/healthz
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: Grid App
    url: https://app.kakunyn.com

status-website:
  baseUrl: /kakunyn-status
  name: Kakunyn Grid Status
  introTitle: "**Kakunyn Grid** — live status for app.kakunyn.com and api.kakunyn.com."
  introMessage: Live uptime data collected every ~5 minutes by GitHub Actions. Incident history is git-tracked in this repository.
  navbar:
    - title: Status
      href: /
    - title: Grid
      href: https://app.kakunyn.com
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
